name: Run tests and build artifacts

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:  # manual triggering
  workflow_call:  # so release.yml can reuse this build matrix
    outputs:
      version:
        description: "seal version read from Cargo.toml"
        value: ${{ jobs.version.outputs.version }}

env:
  # pull_request runs check out a temporary merge into main by default. luwu-classes builds the
  # branch head instead because luwu-latest's version hash has to name a commit that exists.
  # An empty ref keeps checkout's default.
  SOURCE_REF: ${{ github.head_ref == 'luwu-classes' && github.event.pull_request.head.sha || '' }}

jobs:
  version: # credit to lune
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Get version from manifest
        id: get_version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: ["version"]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux is built separately in build-linux (old-glibc container)
        os: [macos-latest, windows-latest, windows-11-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Build project
        run: cargo build --release

      - name: Upload artifacts
        # uploaded before the tests so a failing test still leaves a binary to download
        uses: actions/upload-artifact@v5
        with:
          name: seal-v${{ needs.version.outputs.version }}-${{ runner.os == 'macOS' && 'macos-darwin' || runner.os == 'Windows' && 'windows' }}-${{ runner.arch == 'X64' && 'x64' || runner.arch == 'ARM64' && 'arm64' }}
          path: ./target/release/seal*

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          BIN_PATH="./target/release/seal"
          TEST_CMD="$BIN_PATH ./tests/run.luau"
          
          # Capture both stdout and stderr separately
          STDOUT_CHECK=$($TEST_CMD 2>/tmp/stderr_output)
          
          # Print stdout to GitHub Actions logs
          echo "$STDOUT_CHECK"
          
          # Check stderr separately
          STDERR_CHECK=$(cat /tmp/stderr_output)
          if [ -n "$STDERR_CHECK" ]; then
            echo "Tests failed! STDERR contains output."
            exit 1
          fi
        shell: bash

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          $BIN_PATH = ".\target\release\seal.exe"
          $SCRIPT_PATH = ".\tests\run.luau"
          $stderrFile = "stderr_output.txt"

          # Run the test and redirect stderr to a file
          & $BIN_PATH $SCRIPT_PATH 2> $stderrFile

          # Check stderr contents
          $stderrContent = Get-Content $stderrFile
          if ($stderrContent.Length -gt 0) {
            Write-Host "Tests failed! STDERR contains output:"
            Write-Host $stderrContent
            exit 1
          }
          # Check exit code explicitly
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tests failed! Process exited with code $LASTEXITCODE."
            exit $LASTEXITCODE
          }
        shell: pwsh

  build-linux:
    needs: ["version"]
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # manylinux_2_28 is AlmaLinux 8 (glibc 2.28), so the binary runs on RHEL 8+ and any newer distro.
    # building on ubuntu-latest would require whatever glibc that runner ships (2.39 on 24.04).
    container: quay.io/pypa/manylinux_2_28_${{ matrix.image-arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            image-arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            image-arch: aarch64

    env:
      # compile liblzma (pulled in by archive) from source and link it statically instead of
      # depending on the system's liblzma.so at runtime
      LZMA_API_STATIC: "1"
      # the image's gcc-toolset g++ links libstdc++ through a linker script that uses the system's
      # (gcc 8) libstdc++.so.6 and statically links anything newer from libstdc++_nonshared.a,
      # so the binary works with RHEL 8's stock libstdc++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Mark workspace as safe for git
        # the container runs as a different uid than the checkout owner; without this build.rs
        # can't read the commit hash/branch
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Build project
        run: cargo build --release

      - name: Check glibc/libstdc++ requirements
        # fail if the binary needs anything newer than RHEL 8 ships
        run: |
          BIN_PATH="./target/release/seal"
          ldd "$BIN_PATH"
          max_glibc=$(objdump -T "$BIN_PATH" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          max_glibcxx=$(objdump -T "$BIN_PATH" | grep -o 'GLIBCXX_[0-9.]*' | sort -Vu | tail -1)
          echo "max glibc symbol: $max_glibc"
          echo "max libstdc++ symbol: ${max_glibcxx:-<none>}"
          if [ "$(printf '%s\n' GLIBC_2.28 "$max_glibc" | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "::error::binary requires $max_glibc, newer than GLIBC_2.28"
            exit 1
          fi
          if [ -n "$max_glibcxx" ] && [ "$(printf '%s\n' GLIBCXX_3.4.25 "$max_glibcxx" | sort -V | tail -1)" != "GLIBCXX_3.4.25" ]; then
            echo "::error::binary requires $max_glibcxx, newer than RHEL 8's libstdc++ (GLIBCXX_3.4.25)"
            exit 1
          fi
          if ldd "$BIN_PATH" | grep -q liblzma; then
            echo "::error::binary dynamically links liblzma"
            exit 1
          fi
        shell: bash

      - name: Upload artifacts
        # uploaded before the tests so a failing test still leaves a binary to download
        uses: actions/upload-artifact@v5
        with:
          name: seal-v${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: ./target/release/seal*

      - name: Check out sealbindings
        # keeps seal extern.load plugin api from drifting from sealbindings
        if: matrix.arch == 'x64'
        uses: actions/checkout@v5
        with:
          repository: seal-runtime/sealbindings
          # seal's luwu-classes branch pairs with sealbindings' luwu branch; main pairs with main
          ref: ${{ (github.head_ref || github.ref_name) == 'luwu-classes' && 'luwu' || 'main' }}
          path: sealbindings

      - name: Check the plugin API matches sealbindings
        if: matrix.arch == 'x64'
        run: ./target/release/seal src/scripts/check_plugin_api.luau sealbindings

      - name: Install test dependencies
        # need lsof to clean up leftover server in http tests
        # retry with a fresh metadata cache when an AlmaLinux mirror serves an empty repomd.xml
        run: |
          for attempt in 1 2 3; do
            dnf install -y lsof && exit 0
            dnf clean all
            sleep 10
          done
          exit 1
      - name: Run tests
        run: |
          # BIN_PATH="./target/release/seal"
          # TEST_CMD="$BIN_PATH ./tests/run.luau"
          useradd --create-home sealtest
          chown -R sealtest "$GITHUB_WORKSPACE"

          BIN_PATH="./target/release/seal"
          TEST_CMD="runuser -u sealtest -- env HOME=/home/sealtest $BIN_PATH ./tests/run.luau"

          # Capture both stdout and stderr separately
          STDOUT_CHECK=$($TEST_CMD 2>/tmp/stderr_output)

          # Print stdout to GitHub Actions logs
          echo "$STDOUT_CHECK"

          # Check stderr separately
          STDERR_CHECK=$(cat /tmp/stderr_output)
          if [ -n "$STDERR_CHECK" ]; then
            echo "Tests failed! STDERR contains output."
            exit 1
          fi
        shell: bash

  build-android:
    needs: ["version"]
    name: build (android-${{ matrix.abi }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: arm64
            target: aarch64-linux-android
            allow-failure: false
          - abi: armeabi-v7a
            arch: armv7
            target: armv7-linux-androideabi
            allow-failure: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build project for Android
        env:
          # the `cc` crate (used by mluau/luau0-src to compile Luau's C++ VM) defaults to linking
          # c++_shared on Android; override to c++_static so the binary doesn't need
          # libc++_shared.so present at runtime (-static-libstdc++ doesn't work here since that only
          # affects clang's own default stdlib choice, not this explicit -l directive from `cc`).
          # c++_static only provides the STL; the low-level Itanium C++ ABI runtime (RTTI, __cxa_*,
          # exception vtables) lives in a separate libc++abi.a that's bundled into libc++_shared.so
          # but must be linked explicitly here, hence the extra -lc++abi below.
          # rustc links with -nodefaultlibs, which keeps clang from adding compiler-rt's builtins. The NDK's
          # libc++abi.a and Luau's C++ call outline atomics (__aarch64_ldadd8_acq_rel and others) defined
          # only in the builtins archive that the run step links after -lc++abi.
          CXXSTDLIB: "c++_static"
        run: |
          clang="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          builtins=$("$clang" --target=${{ matrix.target }}24 -print-libgcc-file-name)
          export RUSTFLAGS="-C link-arg=-lc++abi -C link-arg=$builtins"
          cargo ndk -t ${{ matrix.abi }} -P 24 build --release

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: seal-v${{ needs.version.outputs.version }}-android-${{ matrix.arch }}
          path: ./target/${{ matrix.target }}/release/seal

  prerelease:
    name: Luwu Nightly Prerelease
    needs: ["version", "build", "build-linux", "build-android"]
    # !cancelled() makes this luwu-classes job run after a failed test so it can report the failure
    if: >-
      !cancelled()
      && (
        github.event_name == 'pull_request'
        && github.head_ref == 'luwu-classes'
        && github.event.pull_request.head.repo.full_name == github.repository
        || github.event_name == 'workflow_dispatch'
        && github.ref_name == 'luwu-classes'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for `gh release create`
    steps:
      - name: Require every build and test to pass
        env:
          RESULTS: ${{ needs.build.result }} ${{ needs.build-linux.result }} ${{ needs.build-android.result }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::not publishing luwu-latest because a build or test failed"
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Make the linux-x64 seal executable
        run: chmod +x ./artifacts/seal-v${{ needs.version.outputs.version }}-linux-x64/seal

      - name: Run prerelease script
        env:
          SEAL_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          GITHUB_TOKEN: ${{ github.token }}
          # the release points at the branch head instead of the merge commit a pull_request run checks out
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./artifacts/seal-v${{ needs.version.outputs.version }}-linux-x64/seal ./src/scripts/prerelease.luwu
